<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Empty Panels Baseline</title>
<link rel="stylesheet" href="/packages/symbiote-ui/themes/default-provider.css">
<script type="importmap">
{
  "imports": {
    "@symbiotejs/symbiote": "/vendor/symbiote/core/index.js",
    "@symbiotejs/symbiote/": "/vendor/symbiote/",
    "symbiote-ui/xr": "/packages/symbiote-ui/xr/index.js"
  }
}
</script>
<style>
  html,
  body {
    background: var(--sn-sys-surface);
    color: var(--sn-sys-on-surface);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  header {
    align-items: center;
    background: var(--sn-sys-surface-panel);
    border-bottom: 1px solid var(--sn-sys-outline);
    display: flex;
    gap: var(--sn-space-md);
    justify-content: space-between;
    padding: var(--sn-space-md) var(--sn-space-lg);
  }

  h1 {
    font-size: 16px;
    margin: 0;
  }

  button {
    background: var(--sn-button-primary-bg);
    border: 1px solid var(--sn-button-primary-bg);
    border-radius: var(--sn-card-radius);
    color: var(--sn-button-color);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 650;
    min-height: 34px;
    padding: 0 var(--sn-space-md);
  }

  button:disabled {
    background: var(--sn-field-control-bg);
    border-color: var(--sn-sys-outline);
    color: var(--sn-sys-on-surface-dim);
    cursor: default;
  }

  main {
    display: grid;
    gap: var(--sn-space-lg);
    grid-template-columns: minmax(320px, 0.82fr) minmax(0, 1.18fr);
    min-height: 0;
    padding: var(--sn-space-lg);
  }

  section {
    background: var(--sn-sys-surface-panel);
    border: 1px solid var(--sn-sys-outline);
    border-radius: var(--sn-card-radius);
    min-height: 0;
    overflow: hidden;
  }

  h2 {
    border-bottom: 1px solid var(--sn-sys-outline);
    font-size: 12px;
    letter-spacing: 0;
    margin: 0;
    padding: var(--sn-space-sm) var(--sn-space-md);
    text-transform: uppercase;
  }

  dl {
    display: grid;
    grid-template-columns: minmax(128px, 0.72fr) minmax(0, 1.28fr);
    margin: 0;
    max-height: calc(100vh - 150px);
    overflow: auto;
  }

  dt,
  dd {
    border-bottom: 1px solid var(--sn-sys-outline);
    margin: 0;
    min-width: 0;
    padding: var(--sn-space-sm) var(--sn-space-md);
  }

  dt {
    color: var(--sn-sys-on-surface-dim);
    font-size: 12px;
    font-weight: 650;
  }

  dd {
    overflow-wrap: anywhere;
  }

  .preview {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  .stage {
    background:
      radial-gradient(circle at 50% 30%, color-mix(in oklch, var(--sn-sys-accent) 15%, transparent), transparent 34%),
      var(--sn-sys-surface);
    display: grid;
    gap: var(--sn-space-lg);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    min-height: 0;
    padding: var(--sn-space-lg);
  }

  .panel {
    background: var(--sn-xr-panel-bg, var(--sn-sys-surface-panel));
    border: 1px solid var(--sn-xr-panel-border, var(--sn-sys-outline));
    border-radius: var(--sn-xr-panel-radius, var(--sn-card-radius));
    box-shadow: var(--sn-xr-panel-shadow);
    min-height: 160px;
    outline: 1px solid transparent;
  }

  .panel:nth-child(1) { opacity: 0.98; }
  .panel:nth-child(2) { opacity: 0.88; }
  .panel:nth-child(3) { opacity: 0.78; }
  .panel:nth-child(4) { opacity: 0.68; }

  canvas {
    background: var(--sn-sys-surface);
    border-top: 1px solid var(--sn-sys-outline);
    display: block;
    height: 220px;
    width: 100%;
  }

  @media (max-width: 860px) {
    main {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>
</head>
<body>
  <header>
    <h1>XR Empty Panels Baseline</h1>
    <button id="enter" type="button" disabled>Checking XR...</button>
  </header>
  <main>
    <section>
      <h2>Runtime</h2>
      <dl id="status"></dl>
    </section>
    <section class="preview">
      <h2>DOM Panel Preview</h2>
      <div class="stage" aria-label="Empty panel preview">
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
      </div>
      <canvas id="canvas" width="1280" height="720"></canvas>
    </section>
  </main>
  <script type="module" src="xr-panels-baseline.js"></script>
</body>
</html>
