<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR HTMLTexture Minimal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/packages/symbiote-ui/themes/default-provider.css">
<script type="importmap">
{
  "imports": {
    "@symbiotejs/symbiote": "/vendor/symbiote/core/index.js",
    "@symbiotejs/symbiote/": "/vendor/symbiote/",
    "symbiote-node/xr": "/packages/symbiote-node/xr.js",
    "symbiote-ui/xr": "/packages/symbiote-ui/xr/index.js",
    "three": "/vendor/three/build/three.module.js?v=0-184-0"
  }
}
</script>
<style>
  html,
  body {
    background: var(--sn-bg);
    color: var(--sn-text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  header {
    align-items: center;
    background: var(--sn-panel-bg);
    border-bottom: 1px solid var(--sn-node-border);
    display: flex;
    gap: var(--sn-space-md);
    justify-content: space-between;
    padding: var(--sn-space-md) var(--sn-space-lg);
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 16px;
    margin: 0;
  }

  .actions {
    align-items: center;
    display: flex;
    gap: var(--sn-space-sm);
  }

  button,
  select {
    border-radius: var(--sn-card-radius);
    font: inherit;
    font-size: 13px;
    min-height: 34px;
  }

  button {
    background: var(--sn-button-primary-bg);
    border: 1px solid var(--sn-button-primary-bg);
    color: var(--sn-button-color);
    cursor: pointer;
    font-weight: 650;
    padding: 0 var(--sn-space-md);
  }

  button:disabled {
    background: var(--sn-field-control-bg);
    border-color: var(--sn-node-border);
    color: var(--sn-text-dim);
    cursor: default;
  }

  select {
    background: var(--sn-field-control-bg);
    border: 1px solid var(--sn-node-border);
    color: var(--sn-text);
    padding: 0 var(--sn-space-sm);
  }

  main {
    min-height: 0;
    position: relative;
  }

  #xr-canvas {
    display: block;
    height: 100%;
    width: 100%;
  }

  #html-source {
    background:
      linear-gradient(135deg, color-mix(in oklch, var(--sn-panel-bg) 86%, var(--sn-node-selected)), var(--sn-panel-bg)),
      var(--sn-panel-bg);
    border: 2px solid var(--sn-node-selected);
    border-radius: 18px;
    box-sizing: border-box;
    color: var(--sn-text);
    display: grid;
    gap: 18px;
    grid-template-rows: auto auto minmax(0, 1fr);
    height: 540px;
    padding: 42px;
    width: 960px;
  }

  #html-source h2 {
    font-size: 44px;
    letter-spacing: 0;
    margin: 0;
  }

  #html-source p {
    color: var(--sn-text-muted);
    font-size: 24px;
    line-height: 1.35;
    margin: 0;
  }

  #html-source ul {
    display: grid;
    gap: 12px;
    margin: 0;
    padding: 0 0 0 28px;
  }

  #html-source li {
    font-size: 22px;
  }

  .diagnostics {
    background: color-mix(in oklch, var(--sn-panel-bg) 92%, transparent);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    bottom: var(--sn-space-lg);
    box-shadow: var(--sn-node-shadow);
    left: var(--sn-space-lg);
    max-width: min(480px, calc(100vw - 32px));
    position: absolute;
    z-index: 2;
  }

  h2.diagnostics-title {
    border-bottom: 1px solid var(--sn-node-border);
    font-size: 12px;
    letter-spacing: 0;
    margin: 0;
    padding: var(--sn-space-sm) var(--sn-space-md);
    text-transform: uppercase;
  }

  dl {
    display: grid;
    grid-template-columns: minmax(150px, 0.8fr) minmax(0, 1.2fr);
    margin: 0;
    max-height: 420px;
    overflow: auto;
  }

  dt,
  dd {
    border-bottom: 1px solid var(--sn-node-border);
    margin: 0;
    min-width: 0;
    padding: var(--sn-space-xs) var(--sn-space-md);
  }

  dt {
    color: var(--sn-text-dim);
    font-size: 12px;
    font-weight: 650;
  }

  dd {
    font-size: 12px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <header>
    <h1>XR HTMLTexture Minimal</h1>
    <div class="actions">
      <select id="mode" aria-label="XR mode">
        <option value="immersive-vr">VR</option>
        <option value="immersive-ar">AR</option>
      </select>
      <button id="enter" type="button" disabled>Checking XR...</button>
    </div>
  </header>
  <main>
    <canvas id="xr-canvas" layoutsubtree>
      <section id="html-source">
        <h2>HTMLTexture source</h2>
        <p>This DOM block is a direct child of the WebGL canvas and should appear as one readable world-space panel.</p>
        <ul>
          <li>Canvas has layoutsubtree</li>
          <li>Texture uses THREE.HTMLTexture</li>
          <li>No fallback material is allowed in this harness</li>
        </ul>
      </section>
    </canvas>
    <section class="diagnostics" aria-label="Diagnostics">
      <h2 class="diagnostics-title">Diagnostics</h2>
      <dl id="status"></dl>
    </section>
  </main>
  <script type="module" src="xr-htmltexture-minimal.js"></script>
</body>
</html>
