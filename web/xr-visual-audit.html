<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Visual Audit</title>
<link rel="stylesheet" href="/packages/symbiote-ui/themes/default-provider.css">
<script type="importmap">
{
  "imports": {
    "@symbiotejs/symbiote": "/vendor/symbiote/core/index.js",
    "@symbiotejs/symbiote/": "/vendor/symbiote/",
    "symbiote-node/xr": "/packages/symbiote-node/xr.js",
    "symbiote-ui/xr": "/packages/symbiote-ui/xr/index.js",
    "iwer": "/vendor/iwer/build/iwer.module.js?v=iwer-2-2-1",
    "@iwer/devui": "/vendor/iwer-devui/build/iwer-devui.module.js?v=devui-1-1-2"
  }
}
</script>
<style>
  html,
  body {
    background: var(--sn-bg);
    color: var(--sn-text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  header {
    align-items: center;
    background: var(--sn-panel-bg);
    border-bottom: 1px solid var(--sn-node-border);
    display: flex;
    gap: var(--sn-space-md);
    justify-content: space-between;
    padding: var(--sn-space-md) var(--sn-space-lg);
  }

  h1,
  h2 {
    font-size: 14px;
    margin: 0;
  }

  h2 {
    border-bottom: 1px solid var(--sn-node-border);
    font-size: 12px;
    padding: var(--sn-space-sm) var(--sn-space-md);
    text-transform: uppercase;
  }

  main {
    display: grid;
    gap: var(--sn-space-md);
    grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.1fr);
    min-height: 0;
    padding: var(--sn-space-md);
  }

  button,
  select {
    background: var(--sn-field-control-bg);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    color: var(--sn-text);
    font: inherit;
    min-height: 34px;
    padding: 0 var(--sn-space-sm);
  }

  button {
    background: var(--sn-button-primary-bg);
    color: var(--sn-button-color);
    cursor: pointer;
    font-weight: 650;
  }

  button:disabled {
    background: var(--sn-field-control-bg);
    color: var(--sn-text-dim);
    cursor: default;
  }

  section {
    background: var(--sn-panel-bg);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    min-height: 0;
    overflow: hidden;
  }

  .actions {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: var(--sn-space-sm);
  }

  .stack {
    display: grid;
    gap: var(--sn-space-md);
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
  }

  dl {
    display: grid;
    grid-template-columns: minmax(128px, 0.74fr) minmax(0, 1.26fr);
    margin: 0;
  }

  dt,
  dd {
    border-bottom: 1px solid var(--sn-node-border);
    margin: 0;
    min-width: 0;
    padding: var(--sn-space-sm) var(--sn-space-md);
  }

  dt {
    color: var(--sn-text-dim);
    font-size: 12px;
    font-weight: 650;
  }

  dd {
    overflow-wrap: anywhere;
  }

  pre {
    color: var(--sn-text);
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0;
    overflow: auto;
    padding: var(--sn-space-md);
    white-space: pre-wrap;
  }

  .views {
    display: grid;
    gap: var(--sn-space-md);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }

  svg {
    background:
      linear-gradient(var(--sn-node-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--sn-node-border) 1px, transparent 1px),
      var(--sn-bg);
    background-size: 36px 36px;
    display: block;
    height: 100%;
    min-height: 260px;
    width: 100%;
  }

  .panel-shape {
    fill: color-mix(in oklch, var(--sn-xr-panel-bg, var(--sn-panel-bg)) 84%, transparent);
    stroke: var(--sn-node-border);
    stroke-width: 2;
  }

  .panel-shape.issue {
    stroke: var(--sn-node-selected);
    stroke-width: 3;
  }

  .label {
    fill: var(--sn-text);
    font: 12px Inter, system-ui, sans-serif;
  }

  .axis {
    stroke: var(--sn-text-dim);
    stroke-dasharray: 4 5;
    stroke-width: 1;
  }

  .eye {
    fill: var(--sn-node-selected);
  }

  @media (max-width: 960px) {
    main {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>
</head>
<body>
  <header>
    <h1>XR Visual Audit</h1>
    <div class="actions">
      <select id="case" aria-label="Audit case">
        <option value="baseline">baseline</option>
        <option value="overlap">overlap</option>
        <option value="bad-facing">bad-facing</option>
        <option value="too-high">too-high</option>
        <option value="low-texture">low-texture</option>
        <option value="missing-controls">missing-controls</option>
      </select>
      <button id="run" type="button">Run audit</button>
      <button id="emulate" type="button">Install IWER</button>
    </div>
  </header>
  <main>
    <div class="stack">
      <section>
        <h2>Status</h2>
        <dl id="status"></dl>
      </section>
      <section>
        <h2>Checks</h2>
        <pre id="checks"></pre>
      </section>
      <section>
        <h2>Panel Map</h2>
        <pre id="panel-map"></pre>
      </section>
      <section>
        <h2>Agent Report</h2>
        <pre id="agent-report"></pre>
      </section>
    </div>
    <section class="views">
      <div>
        <h2>Top View: X / Z</h2>
        <svg id="top-view" viewBox="0 0 720 320" role="img" aria-label="XR top view map"></svg>
      </div>
      <div>
        <h2>Front View: X / Y</h2>
        <svg id="front-view" viewBox="0 0 720 320" role="img" aria-label="XR front view map"></svg>
      </div>
    </section>
  </main>
  <script type="module" src="/xr-visual-audit.js"></script>
</body>
</html>
