<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Three Panels Baseline</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/packages/symbiote-node/themes/default-provider.css">
<script type="importmap">
{
  "imports": {
    "symbiote-node/xr": "/packages/symbiote-node/xr/index.js",
    "three": "/vendor/three/build/three.module.js?v=0-170-0"
  }
}
</script>
<style>
  html,
  body {
    background: var(--sn-bg);
    color: var(--sn-text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  header {
    align-items: center;
    background: var(--sn-panel-bg);
    border-bottom: 1px solid var(--sn-node-border);
    display: flex;
    gap: var(--sn-space-md);
    justify-content: space-between;
    padding: var(--sn-space-md) var(--sn-space-lg);
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 16px;
    margin: 0;
  }

  .actions {
    align-items: center;
    display: flex;
    gap: var(--sn-space-sm);
  }

  .toggle {
    align-items: center;
    color: var(--sn-text-muted);
    display: inline-flex;
    font-size: 12px;
    gap: var(--sn-space-xs);
    min-height: 34px;
    white-space: nowrap;
  }

  .toggle input {
    accent-color: var(--sn-node-selected);
  }

  button {
    background: var(--sn-button-primary-bg);
    border: 1px solid var(--sn-button-primary-bg);
    border-radius: var(--sn-card-radius);
    color: var(--sn-button-color);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 650;
    min-height: 34px;
    padding: 0 var(--sn-space-md);
  }

  select {
    background: var(--sn-field-control-bg);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    color: var(--sn-text);
    font: inherit;
    font-size: 13px;
    min-height: 34px;
    padding: 0 var(--sn-space-sm);
  }

  button:disabled {
    background: var(--sn-field-control-bg);
    border-color: var(--sn-node-border);
    color: var(--sn-text-dim);
    cursor: default;
  }

  main {
    min-height: 0;
    position: relative;
  }

  canvas {
    display: block;
    height: 100%;
    width: 100%;
  }

  .diagnostics {
    background: color-mix(in oklch, var(--sn-panel-bg) 92%, transparent);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    bottom: var(--sn-space-lg);
    box-shadow: var(--sn-node-shadow);
    left: var(--sn-space-lg);
    max-width: min(420px, calc(100vw - 32px));
    position: absolute;
    z-index: 2;
  }

  .live-panels {
    display: grid;
    gap: var(--sn-space-sm);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width: min(460px, calc(100vw - 32px));
    position: absolute;
    right: var(--sn-space-lg);
    top: var(--sn-space-lg);
    z-index: 2;
  }

  .live-panel-source {
    background: color-mix(in oklch, var(--sn-panel-bg) 92%, transparent);
    border: 1px solid var(--sn-node-border);
    border-radius: var(--sn-card-radius);
    box-sizing: border-box;
    box-shadow: var(--sn-node-shadow);
    height: 136px !important;
    min-height: 0;
    overflow: hidden;
    width: 220px !important;
  }

  .live-panel-source > .sn-xr-panel-live-root {
    transform: scale(0.16);
    transform-origin: top left;
  }

  .live-panel-canvas-source {
    display: block;
    height: var(--sn-xr-content-height, 720px);
    left: -10000px;
    pointer-events: none;
    position: fixed;
    top: 0;
    width: var(--sn-xr-content-width, 1280px);
  }

  xr-baseline-live-panel {
    box-sizing: border-box;
    display: grid;
    gap: var(--sn-space-sm);
    grid-template-rows: auto auto minmax(0, 1fr);
    padding: var(--sn-space-md);
  }

  xr-baseline-live-panel h3 {
    color: var(--sn-text);
    font-size: 13px;
    margin: 0;
  }

  xr-baseline-live-panel p,
  xr-baseline-live-panel li {
    color: var(--sn-text-muted);
    font-size: 12px;
    margin: 0;
  }

  xr-baseline-live-panel ul {
    display: grid;
    gap: 4px;
    margin: 0;
    padding: 0 0 0 var(--sn-space-md);
  }

  h2 {
    border-bottom: 1px solid var(--sn-node-border);
    font-size: 12px;
    letter-spacing: 0;
    margin: 0;
    padding: var(--sn-space-sm) var(--sn-space-md);
    text-transform: uppercase;
  }

  dl {
    display: grid;
    grid-template-columns: minmax(120px, 0.72fr) minmax(0, 1.28fr);
    margin: 0;
    max-height: 320px;
    overflow: auto;
  }

  dt,
  dd {
    border-bottom: 1px solid var(--sn-node-border);
    margin: 0;
    min-width: 0;
    padding: var(--sn-space-xs) var(--sn-space-md);
  }

  dt {
    color: var(--sn-text-dim);
    font-size: 12px;
    font-weight: 650;
  }

  dd {
    font-size: 12px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <header>
    <h1>XR Three Panels Baseline</h1>
    <div class="actions">
      <select id="mode" aria-label="XR mode">
        <option value="">Auto mode</option>
        <option value="immersive-ar">AR panels</option>
        <option value="immersive-vr">VR panels</option>
      </select>
      <label class="toggle">
        <input id="strict-texture" type="checkbox">
        Strict texture
      </label>
      <button id="enter" type="button" disabled>Checking XR...</button>
    </div>
  </header>
  <main>
    <div class="diagnostics">
      <h2>Runtime</h2>
      <dl id="status"></dl>
    </div>
    <div id="live-panels" class="live-panels" aria-label="Live DOM panel sources"></div>
  </main>
  <script type="module" src="xr-three-panels-baseline.js"></script>
</body>
</html>
