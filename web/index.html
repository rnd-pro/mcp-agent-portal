<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Portal</title>
<meta name="description" content="Unified control center for MCP servers and AI agents">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
    {
      "imports": {
        "@symbiotejs/symbiote": "/vendor/symbiote/core/index.js",
        "@symbiotejs/symbiote/": "/vendor/symbiote/",
        "symbiote-node": "/packages/symbiote-node/index.js",
        "symbiote-node/ui": "/packages/symbiote-node/ui/index.js",
        "symbiote-node/graph": "/packages/symbiote-node/graph/index.js",
        "symbiote-node/layout": "/packages/symbiote-node/layout/index.js",
        "symbiote-node/display/highlight": "/packages/symbiote-node/display/highlight.js",
        "symbiote-node/display/markdown-formatter": "/packages/symbiote-node/display/markdown-formatter.js",
        "symbiote-node/": "/packages/symbiote-node/"
      }
    }
  </script>
</head>
<body>
<div class="app-shell">
<header class="app-topbar">
<div class="topbar-left">
<span class="material-symbols-outlined app-title-icon">hub</span>
<span class="app-title">Agent Portal</span>
</div>
<div class="topbar-center">
  <span class="material-symbols-outlined topbar-project-icon">folder_open</span>
  <span id="active-project-path">Workspace not selected</span>
</div>
</header>
<project-tabs></project-tabs>
<div id="main-layout" class="app-workspace">
<layout-sidebar id="app-sidebar"></layout-sidebar>
<div class="app-content">
  <panel-layout id="app-layout" min-panel-size="150"></panel-layout>
</div>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
