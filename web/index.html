<script>
  (() => {
    let basePath = window.AGENT_PORTAL_BASE_PATH;
    if (!basePath) {
      basePath = location.pathname.endsWith('/')
        ? location.pathname
        : location.pathname.replace(/\/[^/]*$/, '/');
    }
    document.write(`<base href="${basePath || '/'}">`);
  })();
</script>
