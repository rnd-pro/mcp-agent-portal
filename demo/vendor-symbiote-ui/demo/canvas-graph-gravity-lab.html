<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Graph Gravity Lab</title>
  <script type="importmap">
    {
      "imports": {
        "@symbiotejs/symbiote": "../node_modules/@symbiotejs/symbiote/core/index.js",
        "@symbiotejs/symbiote/": "../node_modules/@symbiotejs/symbiote/"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --sn-sys-surface: #151515;
      --sn-sys-surface-panel: #202020;
      --sn-sys-surface-raised: #272727;
      --sn-sys-outline: rgba(255, 255, 255, 0.14);
      --sn-sys-state-hover-mix: 6%;
      --sn-sys-accent: #4c8bf5;
      --sn-conn-color: #4c8bf5;
      --sn-sys-on-surface: #f0f0f0;
      --sn-sys-on-surface-dim: #aaa;
      --sn-font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sn-graph-type-data: #4c8bf5;
      --sn-graph-type-action: #34a853;
      --sn-graph-type-docs: #fbbc04;
      --sn-graph-type-token: #a142f4;
      --sn-graph-type-config: #ff6d01;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--sn-sys-surface);
      color: var(--sn-sys-on-surface);
      font-family: var(--sn-font);
    }

    body {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 360px;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--sn-sys-outline);
    }

    canvas-graph {
      width: 100%;
      height: 100%;
      background: var(--sn-sys-surface);
    }

    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--sn-sys-surface-panel);
    }

    .panel-head,
    .panel-actions,
    .diagnostics {
      padding: 14px;
      border-bottom: 1px solid var(--sn-sys-outline);
    }

    .panel-head {
      display: grid;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .hint {
      color: var(--sn-sys-on-surface-dim);
      font-size: 12px;
      line-height: 1.35;
    }

    .controls {
      display: grid;
      gap: 12px;
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--sn-sys-on-surface-dim);
      font-size: 12px;
      line-height: 1.2;
    }

    .field-row strong {
      color: var(--sn-sys-on-surface);
      font-size: 12px;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--sn-sys-accent);
    }

    select,
    button {
      height: 34px;
      border: 1px solid var(--sn-sys-outline);
      border-radius: 7px;
      background: var(--sn-sys-surface-raised);
      color: var(--sn-sys-on-surface);
      font: inherit;
      font-size: 13px;
    }

    select {
      width: 100%;
      padding: 0 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 11px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible,
    select:focus-visible {
      border-color: var(--sn-sys-accent);
      outline: none;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .diagnostics {
      display: grid;
      gap: 8px;
      border-top: 1px solid var(--sn-sys-outline);
      border-bottom: 0;
      color: var(--sn-sys-on-surface-dim);
      font-size: 12px;
    }

    .diagnostics code {
      display: block;
      max-height: 120px;
      overflow: auto;
      padding: 9px;
      border: 1px solid var(--sn-sys-outline);
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--sn-sys-on-surface);
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="stage">
    <canvas-graph id="graph"></canvas-graph>
  </main>
  <aside class="panel">
    <header class="panel-head">
      <h1>Canvas Graph Gravity Lab</h1>
      <div class="hint">Tune force gravity, replay node appearance, and verify one-node zoom/focus behavior.</div>
    </header>
    <section class="controls" id="controls"></section>
    <footer class="diagnostics">
      <div>Diagnostics</div>
      <code id="diagnostics">{}</code>
    </footer>
  </aside>
  <script type="module" src="./canvas-graph-gravity-lab.js?v=gravity-lab-layout-algorithms-v1"></script>
</body>

</html>
